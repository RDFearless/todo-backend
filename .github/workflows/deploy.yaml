name: Deploy Collab Task Backend

on:
  push:
    branches:
          - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Prepare SSH key
        run: |
          printf '%s' "${{ secrets.SSH_KEY }}" | sed 's/\\n/\n/g' | tr -d '\r' > "${{ github.workspace }}/.deploy_key"
          chmod 600 "${{ github.workspace }}/.deploy_key"

      - name: Deploy Via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: root
          key_path: /github/workspace/.deploy_key
          script: |
            cd todo-backend/
            git pull
            docker compose up -d --build